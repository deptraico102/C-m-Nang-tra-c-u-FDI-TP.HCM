<html lang="vi" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Knowledge Hub - Tổ 3 • 11A12 • THPT Phú Hòa</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap&subset=vietnamese" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{--sky:#38BDF8}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Be Vietnam Pro","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;background:#0e0d12;color:#f8fafc;min-height:100vh}
.mono{font-family:inherit;letter-spacing:.01em}
:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
.orb{position:fixed;z-index:0;pointer-events:none;border-radius:50%}
#vn-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#000}
#vn-bg-img{width:100%;height:100%;object-fit:cover;opacity:.72;filter:brightness(.74) contrast(1.06);transition:opacity .45s ease,filter .45s ease,transform .6s ease}
#vn-bg-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,.78) 100%);transition:background .45s ease}
body.fdi-dim-bg #vn-bg-img{opacity:.2;filter:brightness(.36) blur(2px);transform:scale(1.02)}
body.fdi-dim-bg #vn-bg-scrim{background:linear-gradient(180deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.93) 100%)}
.o1{top:-15%;left:15%;width:550px;height:550px;background:radial-gradient(circle,rgba(56,189,248,.14),transparent 70%);filter:blur(60px)}
.o2{bottom:10%;right:10%;width:500px;height:500px;background:radial-gradient(circle,rgba(125,211,252,.1),transparent 70%);filter:blur(70px)}
.glow,.silver{padding:.14em 0;line-height:1.3}
.glow{background:linear-gradient(180deg,#fff,#94a3b8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.silver{background:linear-gradient(135deg,#fff,#E2E8F0 50%,#38BDF8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.glass{background:rgba(15,23,42,.65);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(56,189,248,.18);box-shadow:0 20px 50px rgba(0,0,0,.55)}
#progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:60;background:linear-gradient(90deg,#38BDF8,#fff)}
/* viền thẻ */
.sb{--c:#fff;--trail:#38BDF8;--d:4s;--r:12px;--g:.6;position:relative;display:inline-flex;border-radius:var(--r);padding:1.5px;overflow:hidden;isolation:isolate;cursor:pointer}
.sb::before,.sb::after{content:'';position:absolute;inset:-150%;animation:orbit var(--d) linear infinite}
.sb::before{background:conic-gradient(from var(--a),transparent 0 240deg,color-mix(in srgb,var(--trail) 40%,transparent) 290deg,var(--trail) 345deg,var(--c) 358deg,transparent 360deg);z-index:-2}
.sb::after{background:conic-gradient(from var(--a),transparent 0 270deg,var(--c) 355deg,transparent 360deg);filter:blur(calc(12px*var(--g)));opacity:var(--g);z-index:-1}
.sb:hover::before,.sb:hover::after{animation-duration:calc(var(--d)*.42)}
.sbi{position:relative;width:100%;border-radius:calc(var(--r) - 1.5px);background:rgba(10,15,29,.92);z-index:1}
.sb.full{display:flex;width:100%}
@keyframes orbit{to{--a:360deg}}
@supports not (background:conic-gradient(from var(--a),red,blue)){.sb{border:1px solid rgba(56,189,248,.4)}}
.pulse{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:10;animation:pulse .6s forwards}
@keyframes pulse{0%{box-shadow:0 0 0 0 #fff;opacity:.9}100%{box-shadow:0 0 24px 8px transparent;opacity:0}}
/* model */
.float{animation:float 4.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}
/* cinema 3d stage */
.cine-stage{position:relative;width:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,rgba(56,189,248,.12),rgba(0,0,0,.92) 72%)}
.cine-stage::before,.cine-stage::after{content:'';position:absolute;left:0;right:0;pointer-events:none;z-index:4}
.cine-stage::before{top:0;height:84px;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent)}
.cine-stage::after{bottom:0;height:140px;background:linear-gradient(0deg,rgba(0,0,0,.92) 15%,transparent)}
/* bento */
.card{overflow:hidden;position:relative;transition:transform .4s cubic-bezier(.16,1,.3,1)}
.card:hover{transform:translateY(-4px)}
.card::before{content:'';position:absolute;top:var(--my,-100px);left:var(--mx,-100px);width:320px;height:320px;background:radial-gradient(circle,rgba(56,189,248,.26),transparent 70%);transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity .3s}
.card:hover::before{opacity:1}
/* accordion */
.acc{display:flex;gap:16px;height:400px}
.acc-i{flex:1;border-radius:24px;overflow:hidden;position:relative;cursor:pointer;border:1px solid rgba(56,189,248,.2);background:#0f172a;transition:flex .65s cubic-bezier(.16,1,.3,1),filter .35s;text-align:left}
.acc:hover .acc-i:not(:hover){filter:blur(1.5px) brightness(.75)}
.acc-i:hover,.acc-i:focus-visible{flex:4}
.acc-i img{width:100%;height:100%;object-fit:cover;transition:transform .7s}
.acc-i:hover img{transform:scale(1.06)}
.acc-o{position:absolute;inset:0;background:linear-gradient(0deg,rgba(3,7,18,.95),rgba(3,7,18,.3) 50%,transparent);display:flex;flex-direction:column;justify-content:flex-end;padding:24px}
@media(max-width:767px){.acc{flex-direction:column;height:auto}.acc-i{flex:none;height:140px}.acc:hover .acc-i:not(:hover){filter:none}}
/* orbit */
#orbit{position:relative;height:460px;touch-action:pan-y pinch-zoom;cursor:grab;user-select:none;-webkit-user-select:none}
@media(max-width:640px){#orbit.drag{touch-action:none}}
#orbit.drag{cursor:grabbing}
.o-ring{position:absolute;left:50%;top:50%;width:76%;height:52%;transform:translate(-50%,-50%);border:1px dashed rgba(56,189,248,.28);border-radius:50%;pointer-events:none}
.o-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:#fff;background:radial-gradient(circle,rgba(56,189,248,.45),rgba(56,189,248,.05) 70%);box-shadow:0 0 60px rgba(56,189,248,.4);pointer-events:none}
.oc{position:absolute;left:50%;top:50%;width:150px;height:190px;border-radius:18px;overflow:hidden;border:1px solid rgba(56,189,248,.4);background:#0f172a;box-shadow:0 18px 36px rgba(0,0,0,.7);will-change:transform;padding:0}
.oc img{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.oc span{position:absolute;inset:auto 0 0 0;padding:26px 10px 9px;text-align:left;font-size:12px;font-weight:700;color:#bae6fd;background:linear-gradient(0deg,rgba(3,7,18,.95),transparent);line-height:1.3}
.oc small{display:block;font-size:10px;font-weight:500;color:#cbd5e1}
@media(max-width:640px){#orbit{height:380px}.oc{width:106px;height:140px}.oc span{font-size:10px;padding-top:18px}.oc small{display:none}}
/* modal */
#modal{transition:opacity .3s}
#modal.hide{opacity:0;pointer-events:none}
.enter{animation:menter .42s cubic-bezier(.16,1,.3,1) forwards}
@keyframes menter{0%{opacity:0;transform:scale(.9) translateY(24px);filter:blur(16px)}60%{filter:blur(3px)}100%{opacity:1;transform:none;filter:none}}
.cur::after{content:'|';animation:blink .7s infinite;color:#38BDF8;font-weight:700}
@keyframes blink{50%{opacity:0}}
.toast{transition:all .3s;transform:translateY(16px);opacity:0}
.toast.in{transform:none;opacity:1}
#preloader{transition:opacity .7s}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
#hdr.sc{background:rgba(14,13,18,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08)}
section[id]{scroll-margin-top:90px}

/* ===== APPLE STYLE ===== */
body{background:#000;color:#f5f5f7}
#hdr .max-w-6xl{padding-top:0;padding-bottom:0;height:48px}
#hdr.sc{background:rgba(22,22,23,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(255,255,255,.1)}
#hdr nav a{font-size:12px;opacity:.82;color:#f5f5f7!important}
#hdr nav a:hover{opacity:1}
#logo3,#snd,#lang{background:transparent!important;border:none!important;border-radius:980px;color:#e8e8ed}
#logo3{width:30px;height:30px;font-size:15px}
#snd,#lang{height:30px;font-size:12px}
#snd:hover,#lang:hover,#logo3:hover{background:rgba(255,255,255,.1)!important}
#home span:first-child{letter-spacing:.12em}
.glass{background:#1d1d1f;backdrop-filter:none;-webkit-backdrop-filter:none;border:none;box-shadow:none;border-radius:28px}
#mcard.glass{background:rgba(10,12,16,.95);backdrop-filter:blur(24px)}
.sb::before,.sb::after{display:none}
.sb{padding:0;border:1px solid rgba(255,255,255,.08);transition:transform .35s cubic-bezier(.16,1,.3,1),border-color .3s}
.sb:hover{border-color:rgba(255,255,255,.2)}
.sb.full:hover{transform:scale(1.015)}
.sb:not(.full){border-radius:980px}
.sb:not(.full) .sbi{border-radius:980px}
.sbi{background:#1d1d1f}
.card::before{display:none}
.card:hover{transform:none}
#bento h3{font-size:clamp(22px,2.4vw,30px);font-weight:600;letter-spacing:-.01em}
#bento p{font-size:15px;line-height:1.5;color:#a1a1a6!important}
#bento .card{padding:2rem}
.glow,.silver{background:none!important;-webkit-text-fill-color:#f5f5f7;color:#f5f5f7}
#wrap h2,#wrap h3.silver{font-size:clamp(30px,4.6vw,52px);font-weight:600;letter-spacing:-.025em;line-height:1.15;text-align:center;color:#f5f5f7!important;-webkit-text-fill-color:#f5f5f7}
#wrap h2 i,#wrap h3.silver i{display:none}
#wrap h2 .mono{font-family:inherit}
.text-slate-300,.text-slate-200{color:#a1a1a6!important}
.text-sky-400,.text-sky-300{color:#2997ff!important}
#wrap .text-sky-400{color:#2997ff!important}
.acc-i{border:none;border-radius:28px}
.mono{letter-spacing:0}
#members button,#members .sb{border-radius:980px}
#members button{background:#1d1d1f;border:none;color:#e8e8ed}
#members button:hover{background:#2a2a2d}
#pills button, #m3d-pills button{border-radius:980px;border:none;background:rgba(255,255,255,.08)!important;color:#e8e8ed!important;font-size:13px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#pills button:hover, #m3d-pills button:hover{background:rgba(255,255,255,.16)!important}
#pills button.active-pill, #m3d-pills button.active-pill{background:#f5f5f7!important;color:#000!important;font-weight:600}
.toast{border-radius:18px}
#px{position:relative;height:min(92vh,860px);overflow:hidden;border-radius:28px;background:#1d1d1f}
#px::before,#px::after{content:'';position:absolute;left:0;right:0;height:90px;z-index:3;pointer-events:none}
#px::before{top:0;background:linear-gradient(#1d1d1f,transparent)}
#px::after{bottom:0;background:linear-gradient(transparent,#1d1d1f)}
#px .grid3{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 14px}
.px-col{display:flex;flex-direction:column;gap:14px;will-change:transform}
.px-col:nth-child(1){margin-top:-18vh}.px-col:nth-child(2){margin-top:-42vh}.px-col:nth-child(3){margin-top:-8vh}
.pxc{position:relative;display:block;width:100%;height:clamp(200px,36vh,360px);border-radius:20px;overflow:hidden;background:#0f0f10;padding:0;cursor:pointer;flex:none}
.pxc img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.16,1,.3,1)}
.pxc:hover img{transform:scale(1.06)}
.pxc span{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;text-align:left;font-size:14px;font-weight:600;color:#f5f5f7;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent)}
.pxc small{display:block;font-size:12px;font-weight:400;color:#a1a1a6}
@media(max-width:640px){#px .grid3{gap:8px;padding:0 8px}.px-col{gap:8px}.pxc{border-radius:14px}.pxc span{font-size:11px;padding:24px 8px 8px}.pxc small{display:none}}

/* ===== TRANG CHỦ ===== */
#heroFx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;-webkit-mask-image:radial-gradient(ellipse at center,#000 35%,transparent 78%);mask-image:radial-gradient(ellipse at center,#000 35%,transparent 78%)}
.rise{opacity:0;transform:translateY(22px);animation:rise .9s cubic-bezier(.16,1,.3,1) forwards;animation-delay:var(--d,0s)}
@keyframes rise{to{opacity:1;transform:none}}
.hw{display:inline-block;opacity:0;transform:translateY(28px);filter:blur(14px);animation:hw .95s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(1s + var(--i)*65ms)}
@keyframes hw{to{opacity:1;transform:none;filter:blur(0)}}
.fdi .hw{background:linear-gradient(90deg,#2997ff,#7dd3fc,#fff,#7dd3fc,#2997ff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:hw .95s cubic-bezier(.16,1,.3,1) forwards,shine 6s linear infinite;animation-delay:calc(1s + var(--i)*65ms),0s}
@keyframes shine{to{background-position:-300% 0}}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:980px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font-size:12px;color:#d2d2d7;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hero-badge .dot{width:7px;height:7px;border-radius:50%;background:#30d158;animation:dotp 2s infinite}
@keyframes dotp{0%{box-shadow:0 0 0 0 rgba(48,209,88,.6)}100%{box-shadow:0 0 0 9px rgba(48,209,88,0)}}
.hero-rot{font-size:clamp(16px,2.2vw,22px);color:#a1a1a6;min-height:1.7em}
#rot{display:inline-block;color:#2997ff;font-weight:600}
.rin{animation:rin .6s cubic-bezier(.16,1,.3,1)}
@keyframes rin{from{opacity:0;transform:translateY(12px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.btn-shine{position:relative;overflow:hidden}
.btn-shine::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-20deg);animation:sweep 3.6s ease-in-out 3s infinite}
@keyframes sweep{0%{left:-60%}35%,100%{left:130%}}
.hero-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding-top:26px}
.hc{display:flex;align-items:center;gap:12px;padding:12px 18px;border-radius:20px;background:rgba(29,29,31,.7);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);text-align:left;animation:bob 6s ease-in-out infinite}
.hc i{color:#2997ff;font-size:18px}
.hc b{display:block;font-size:17px;font-weight:600;color:#f5f5f7;letter-spacing:-.01em}
.hc small{font-size:12px;color:#a1a1a6}
@keyframes bob{50%{transform:translateY(-8px)}}
.hero-cue{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:5}
.cue-m{display:block;width:24px;height:38px;border:2px solid rgba(255,255,255,.4);border-radius:14px;position:relative}
.cue-m i{position:absolute;left:50%;top:7px;width:3px;height:8px;margin-left:-1.5px;border-radius:2px;background:#f5f5f7;animation:wheel 1.8s ease-in-out infinite}
@keyframes wheel{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(14px)}}
@media(max-width:640px){.hero-cue{display:none}.hc{padding:10px 14px}}
/* ===== SỐ LIỆU NỔI BẬT ===== */
.num{font-size:clamp(44px,5.4vw,72px);font-weight:600;letter-spacing:-.035em;line-height:1.05;margin-bottom:.5rem;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#f5f5f7 20%,#2997ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
/* ===== GIỚI THIỆU TOÀN MÀN HÌNH ===== */
#se{width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw)}
.se-track{position:relative}
.se-stage{position:sticky;top:0;height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#000}
.se-frame{position:absolute;inset:0;overflow:hidden;will-change:clip-path;clip-path:inset(21% 29% 21% 29% round 24px)}
.se-media{width:100%;height:100%;object-fit:cover;transform-origin:center;will-change:transform;display:block;transform:scale(1.35)}
.se-scrim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.se-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;opacity:0;will-change:opacity,transform}
.se-overlay h3{font-size:clamp(28px,5vw,60px);font-weight:600;letter-spacing:-.025em;line-height:1.15;color:#f5f5f7}
.se-overlay p{margin-top:14px;max-width:640px;font-size:clamp(15px,2vw,21px);color:#d2d2d7}
.se-title{position:absolute;z-index:2;left:0;right:0;text-align:center;padding:0 20px;pointer-events:none;font-weight:600;letter-spacing:-.03em;line-height:1.1;font-size:var(--se-title-size,56px);color:#f5f5f7;text-shadow:0 2px 30px rgba(0,0,0,.6);will-change:opacity,transform}
.se-hint{position:absolute;z-index:2;bottom:6vh;left:0;right:0;text-align:center;font-size:13px;color:#a1a1a6;pointer-events:none;letter-spacing:.04em}

  .hero-rot { font-size: 15px !important; min-height: 1.6em; }

  #model canvas#fdi3d { height: 56svh !important; min-height: 320px !important; max-height: 440px !important; }

  #pills button { padding: 7px 12px !important; font-size: 12px !important; }

  .glass { border-radius: 22px !important; }
  #bento { gap: 12px !important; }
  #bento .card { padding: 1.25rem !important; }

let actx=null, masterGain=null, noiseBuf=null, muted=localStorage.getItem('mute')==='1', introPlayed=false, lastHover=0;
const SND={
 tine:{d:1.2,l:-17.5,lp:7500,L:[[587.33,0,.7],[880,.13,.9]]},
 wrap:{d:.35,l:-18.5,lp:7000,L:[[880,0,.12],[587.33,.11,.18]]},

function ensureAudio(){
 if(muted)return null;
 try{
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx)return null;
  if(!actx){
   actx=new AudioCtx();
   masterGain=actx.createGain();
   masterGain.gain.value=1;
   masterGain.connect(actx.destination);
  }
  if(actx.state==='suspended')actx.resume().catch(()=>{});
  return actx;
 }catch(e){return null}
}
function getWarmNoise(dur=0.8){
 const c=ensureAudio(); if(!c)return null;
 if(noiseBuf&&noiseBuf.duration>=dur)return noiseBuf;
 const len=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,len,c.sampleRate), ch=buf.getChannelData(0);
 let prev=0;
 for(let i=0;i<len;i++){
  const w=Math.random()*2-1;
  prev=(prev+.045*w)/1.045;
  ch[i]=prev*2.4;
 }
 noiseBuf=buf; return buf;
}
function playIntro(){
 if(muted||reduce||introPlayed)return;
 const c=ensureAudio(); if(!c||c.state!=='running')return;
 introPlayed=true;
 const now=c.currentTime, notes=[110,164.81,220,329.63];
 const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=2;
 lp.frequency.setValueAtTime(150,now);
 lp.frequency.exponentialRampToValueAtTime(1400,now+.9);
 lp.frequency.exponentialRampToValueAtTime(380,now+2.2);
 const bus=c.createGain();
 bus.gain.setValueAtTime(.0001,now);
 bus.gain.linearRampToValueAtTime(.19,now+.35);
 bus.gain.exponentialRampToValueAtTime(.0001,now+2.25);
 lp.connect(bus); bus.connect(masterGain);
 notes.forEach((fr,idx)=>{
  const osc=c.createOscillator(), g=c.createGain();
  osc.type=idx%2===0?'triangle':'sine';
  osc.frequency.setValueAtTime(fr*.995,now);
  osc.frequency.exponentialRampToValueAtTime(fr,now+.75);
  osc.detune.setValueAtTime((idx-1.5)*5,now);
  g.gain.value=1/(idx*.35+1);
  osc.connect(g); g.connect(lp);
  osc.start(now); osc.stop(now+2.3);
 });
}
function playWhoosh(){
 if(muted||reduce)return;
 const c=ensureAudio(), buf=getWarmNoise(.6); if(!c||!buf)return;
 const now=c.currentTime, src=c.createBufferSource(); src.buffer=buf;
 const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.5;
 bp.frequency.setValueAtTime(210,now);
 bp.frequency.exponentialRampToValueAtTime(1550,now+.22);
 bp.frequency.exponentialRampToValueAtTime(280,now+.52);
 const g=c.createGain();
 g.gain.setValueAtTime(.0001,now);
 g.gain.linearRampToValueAtTime(.16,now+.17);
 g.gain.exponentialRampToValueAtTime(.0001,now+.55);
 src.connect(bp); bp.connect(g); g.connect(masterGain);
 src.start(now); src.stop(now+.56);
}
function playRipple(){
 if(muted||reduce)return;
 const c=ensureAudio(); if(!c)return;
 const now=c.currentTime, osc=c.createOscillator(), g=c.createGain();
 osc.type='sine';
 osc.frequency.setValueAtTime(250,now);
 osc.frequency.exponentialRampToValueAtTime(110,now+.36);
 g.gain.setValueAtTime(.0001,now);
 g.gain.linearRampToValueAtTime(.13,now+.02);
 g.gain.exponentialRampToValueAtTime(.0001,now+.38);
 osc.connect(g); g.connect(masterGain);
 osc.start(now); osc.stop(now+.4);
}
function playHover(){
 if(muted||reduce)return;
 const ms=performance.now(); if(ms-lastHover<110)return; lastHover=ms;
 const c=ensureAudio(); if(!c||c.state!=='running')return;
 const now=c.currentTime, osc=c.createOscillator(), g=c.createGain();
 osc.type='sine';
 osc.frequency.setValueAtTime(520,now);
 osc.frequency.exponentialRampToValueAtTime(250,now+.03);
 g.gain.setValueAtTime(.0001,now);
 g.gain.linearRampToValueAtTime(.025,now+.004);
 g.gain.exponentialRampToValueAtTime(.0001,now+.035);
 osc.connect(g); g.connect(masterGain);
 osc.start(now); osc.stop(now+.04);
}
function play(name){
 if(muted)return;
 if(name==='intro')return playIntro();
 if(name==='whoosh')return playWhoosh();
 if(name==='ripple')return playRipple();
 if(name==='hover')return playHover();
 try{
  const c=ensureAudio(); if(!c)return;
  const spec=SND[name]||SND.tine, now=c.currentTime, g=c.createGain(), f=c.createBiquadFilter();
  g.gain.value=Math.pow(10,spec.l/20)*2.5; f.type='lowpass'; f.frequency.value=spec.lp;
  g.connect(f); f.connect(masterGain);
  spec.L.forEach(([fr,at,dec])=>{
   const o=c.createOscillator(), e=c.createGain(), s=now+at;
   o.frequency.value=fr; e.gain.setValueAtTime(.0001,s);
   e.gain.linearRampToValueAtTime(1,s+.005); e.gain.exponentialRampToValueAtTime(.0001,s+.015+dec);
   o.connect(e); e.connect(g); o.start(s); o.stop(s+dec+.1);
  });
 }catch(e){}
}

}

function countUp(el){

 if(reduce){el.textContent=fmtNum(to,dec,pre,suf);return}

}

function watchNums(){

}

function bindOrbitPinchTap(canvas, opts){
 const ptrs=new Map();
 let prevPinch=null, moved=0, downTime=0, wasPinch=false;
 const pinchDist=()=>{const[a,b]=[...ptrs.values()];return Math.hypot(a.x-b.x,a.y-b.y)};

 canvas.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{canvas.setPointerCapture(e.pointerId)}catch(_){}
  opts.onInteract&&opts.onInteract();
  if(ptrs.size===1){
   moved=0; downTime=performance.now(); wasPinch=false;
   canvas.style.cursor='grabbing';
   opts.onSingleStart&&opts.onSingleStart(e);
  }else if(ptrs.size>=2){
   wasPinch=true;
   prevPinch=pinchDist();
   opts.onPinchStart&&opts.onPinchStart();
  }
 });

 canvas.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const prev=ptrs.get(e.pointerId);
  const curr={x:e.clientX,y:e.clientY};
  ptrs.set(e.pointerId,curr);
  opts.onInteract&&opts.onInteract();

  if(ptrs.size===1&&!wasPinch){
   const dx=curr.x-prev.x, dy=curr.y-prev.y;
   moved+=Math.abs(dx)+Math.abs(dy);
   opts.onDrag&&opts.onDrag(dx,dy,moved,e);
  }else if(ptrs.size>=2){
   const d=pinchDist();
   if(prevPinch&&d>0){
    opts.onPinch&&opts.onPinch(prevPinch-d);
   }
   prevPinch=d;
  }
 });

 const onRelease=e=>{
  const had=ptrs.get(e.pointerId);
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)prevPinch=null;
  if(ptrs.size===0){
   canvas.style.cursor='grab';
   opts.onInteract&&opts.onInteract();
   const elapsed=performance.now()-downTime;
   const isTap=!wasPinch&&moved<=10&&elapsed<550;
   const pt=had||{x:e.clientX,y:e.clientY};
   opts.onEnd&&opts.onEnd(isTap,pt,e);
   wasPinch=false;
  }else if(ptrs.size===1){
   const rem=[...ptrs.values()][0];
   opts.onSingleStart&&opts.onSingleStart({clientX:rem.x,clientY:rem.y});
  }
 };

 canvas.addEventListener('pointerup',onRelease);
 canvas.addEventListener('pointercancel',onRelease);
}

   const zwarm=new THREE.PointLight(0xf59e0b,1.25,35); zwarm.position.set(6,4.5,5); zsc.add(zwarm);
   zpivot.position.y=-1.45; zsc.add(zpivot);

   const pack=window.buildFDIScenePack(modelIdx);
   let zcur=pack.group, zanim=pack.anim, zwaters=pack.waters, zborn=performance.now();
   zcur.scale.setScalar(.01); zpivot.add(zcur);

   let zry=.6, zrx=.42, zdist=17.5, zdrag=false, zpx=0, zpy=0, zlastInt=performance.now(), zlastF=performance.now(), rafId=0, stopped=false;
   const zfit=()=>{const w=zcv.clientWidth,h=zcv.clientHeight;if(!w||!h)return;ZR.setSize(w,h,false);zcam.aspect=w/h;zcam.updateProjectionMatrix()};
   const ro=new ResizeObserver(zfit); ro.observe(zcv); zfit();

   $('#m3d-reset').onclick=()=>{play('tine');zry=.6;zrx=.42;zdist=17.5};
   $('#m3d-pills').addEventListener('click',e=>{
    const b=e.target.closest('[data-zm]'); if(!b)return;
    const idx=+b.dataset.zm; modelIdx=idx; play('tine');
    renderPills(); window.setFDIScene&&setFDIScene(idx);
    $('#m3d-cap').textContent=t('cap')[idx];
    $('#m3d-pills').querySelectorAll('[data-zm]').forEach((btn,bi)=>{
     btn.className=`px-3.5 py-1.5 text-xs mono transition ${bi===idx?'active-pill':''}`;
    });
    if(zcur){zpivot.remove(zcur);zcur.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material&&o.material.dispose)o.material.dispose()})}
    const np=window.buildFDIScenePack(idx);
    zcur=np.group; zanim=np.anim; zwaters=np.waters; zborn=performance.now();
    zcur.scale.setScalar(.01); zpivot.add(zcur);
   });

   const zrc=new THREE.Raycaster(), zv2=new THREE.Vector2();
   const triggerZoomRipple=pt=>{
    if(!zwaters.length)return false;
    const r=zcv.getBoundingClientRect();
    zv2.set((pt.x-r.left)/r.width*2-1,-((pt.y-r.top)/r.height)*2+1);
    zrc.setFromCamera(zv2,zcam);
    const hit=zrc.intersectObjects(zwaters.map(w=>w.mesh))[0];
    if(!hit)return false;
    const w=zwaters.find(x=>x.mesh===hit.object), p=hit.object.worldToLocal(hit.point.clone());
    w.ripple(p.x,p.z,performance.now()/1000); play('ripple');
    return true;
   };

   bindOrbitPinchTap(zcv,{
    onInteract:()=>{zlastInt=performance.now()},
    onSingleStart:e=>{zdrag=true;zpx=e.clientX;zpy=e.clientY},
    onDrag:(dx,dy)=>{
     zry+=dx*.0085;
     zrx=Math.max(.1,Math.min(1.25,zrx+dy*.0055));
     zpx+=dx; zpy+=dy;
    },
    onPinch:deltaPx=>{
     zdist=Math.max(8,Math.min(25,zdist+deltaPx*.028));
    },
    onEnd:(isTap,pt)=>{
     zdrag=false;
     if(isTap)triggerZoomRipple(pt);
    }
   });
   zcv.addEventListener('wheel',e=>{e.preventDefault();zdist=Math.max(8,Math.min(25,zdist+e.deltaY*.012));zlastInt=performance.now()},{passive:false});
   zcam.position.set(0,0,zdist);

   function zframe(now){
    if(stopped)return;
    rafId=requestAnimationFrame(zframe);
    const dt=Math.min(.05,(now-zlastF)/1000); zlastF=now;
    if(!zdrag&&!reduce&&now-zlastInt>1500)zry+=.003;
    zpivot.rotation.x=zrx; zpivot.rotation.y=zry;
    zcam.position.z+=(zdist-zcam.position.z)*.14;
    const k=Math.min(1,(now-zborn)/600); zcur.scale.setScalar(.01+.99*(1-Math.pow(1-k,3)));
    const sec=now/1000;
    zwaters.forEach(w=>w.update(sec,dt));
    zanim.forEach(f=>f(sec,dt));
    ZR.render(zsc,zcam);
   }
   rafId=requestAnimationFrame(zframe);

   cleanupModal3D=()=>{
    stopped=true; cancelAnimationFrame(rafId); ro.disconnect();
    if(zcur){zpivot.remove(zcur);zcur.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material&&o.material.dispose)o.material.dispose()})}
    ZR.dispose();
   };
  }
 );
}

$('#pills').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;modelIdx=+b.dataset.m;play('tine');renderPills();window.setFDIScene&&setFDIScene(modelIdx)});
$('#reset').onclick=()=>{play('tine');window.fdiReset&&fdiReset()};
function initFDI3D(){
 const cv=$('#fdi3d');
 if(typeof THREE==='undefined'){cv.replaceWith(Object.assign(document.createElement('p'),{className:'p-10 text-sm text-slate-300',textContent:'Cần kết nối mạng để tải Three.js / Requires internet to load Three.js'}));return}
 const isMobile=innerWidth<768;
 let R;try{R=new THREE.WebGLRenderer({canvas:cv,antialias:!isMobile,alpha:true,powerPreference:isMobile?'low-power':'high-performance'})}catch(e){return}
 R.setPixelRatio(Math.min(devicePixelRatio||1,isMobile?1.5:2));
 R.shadowMap.enabled=true;
 R.shadowMap.type=isMobile?THREE.BasicShadowMap:THREE.PCFSoftShadowMap;
 R.toneMapping=THREE.ACESFilmicToneMapping;
 R.toneMappingExposure=1.08;

 const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(42,1,.1,100),pivot=new THREE.Group();
 sc.add(new THREE.HemisphereLight(0xbae6fd,0x334155,.78));
 sc.add(new THREE.AmbientLight(0xbfdfff,.45));
 const dl=new THREE.DirectionalLight(0xfff7ed,1.15);
 dl.position.set(7,12,8);
 dl.castShadow=true;
 const sm=isMobile?512:1024;
 dl.shadow.mapSize.set(sm,sm);
 dl.shadow.camera.near=1;
 dl.shadow.camera.far=35;
 const dCam=9.5;
 dl.shadow.camera.left=-dCam; dl.shadow.camera.right=dCam;
 dl.shadow.camera.top=dCam; dl.shadow.camera.bottom=-dCam;
 dl.shadow.bias=-0.0005;
 sc.add(dl);

 const pl=new THREE.PointLight(0x38bdf8,1.35,40);pl.position.set(-6,5,-4);sc.add(pl);
 const warmRim=new THREE.PointLight(0xf59e0b,1.25,35);warmRim.position.set(6,4.5,5);sc.add(warmRim);

 pivot.position.y=-1.45;sc.add(pivot);
 const DEFAULT_DIST=18.2;
 let cur=null,anim=[],waters=[],born=0,ry=.6,rx=.42,dist=DEFAULT_DIST,drag=false,wasDrag=false,px=0,py=0,lastInt=0,vis=true;
 const M=(c,e=0,i=0,m=.3,r=.48)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,emissive:e,emissiveIntensity:i});
 const bx=(g,w,h,d,mat,x,y,z,edge,castS=!isMobile,recvS=true)=>{
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y+h/2,z);
  m.castShadow=castS; m.receiveShadow=recvS;
  if(edge&&!isMobile)m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:0xe2e8f0,transparent:true,opacity:.22})));
  g.add(m);return m;
 };
 const rng=seed=>{let sd=seed;return()=>(sd=sd*16807%2147483647)/2147483647};
 let lastF=performance.now(),mv=0;

 function buildScenePack(idx){
  const locAnim=[], locWaters=[];
  function makeWater(w,d,nx,nz,col){
   const segX=isMobile?Math.max(4,Math.round(nx*.55)):nx;
   const segZ=isMobile?Math.max(10,Math.round(nz*.55)):nz;
   const geo=new THREE.PlaneGeometry(w,d,segX,segZ);geo.rotateX(-Math.PI/2);
   const mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:col,emissive:0x0369a1,emissiveIntensity:.45,roughness:.18,metalness:.68,transparent:true,opacity:.92,flatShading:true}));
   mesh.receiveShadow=true;
   const pos=geo.attributes.position,b0=new Float32Array(pos.array),rip=[];
   const H=(x,z,t)=>{let h=.045*Math.sin(x*2.3+t*1.7)+.04*Math.sin(z*1.6-t*1.35)+.022*Math.sin((x+z)*3.4+t*2.5);
    for(const r of rip){const age=t-r.t;if(age<0)continue;const k=Math.hypot(x-r.x,z-r.z)-age*1.3;h+=.11*Math.exp(-age*.8)*Math.exp(-k*k*12)*Math.cos(k*13)}
    return h};
   function ripple(x,z,tCur){rip.push({x:x,z:z,t:tCur});if(rip.length>14)rip.shift()}
   let nTick=0;
   function update(t){
    if(rip.length&&t-rip[0].t>4)rip.shift();
    for(let i=0;i<pos.count;i++){pos.setY(i,H(b0[i*3],b0[i*3+2],t))}
    pos.needsUpdate=true;
    if(!isMobile||(++nTick&1)===0)geo.computeVertexNormals();
   }
   const o={mesh:mesh,H:H,ripple:ripple,update:update};
   locWaters.push(o);return o;
  }

  function floater(obj,w,sx,sz,base,k,c){
   let y=base,vy=0,rx=0,rz=0;
   return (t,dt)=>{const x=sx(),z=sz(),h=w.H(x,z,t);
    vy+=((base+h-y)*k-vy*c)*dt;y+=vy*dt;obj.position.y=y;
    const e=.2,hx=(w.H(x+e,z,t)-w.H(x-e,z,t))/(2*e),hz=(w.H(x,z+e,t)-w.H(x,z-e,t))/(2*e),a=Math.min(1,dt*6);
    rz+=(Math.atan(hx)-rz)*a;rx+=(-Math.atan(hz)-rx)*a;obj.rotation.z=rz;obj.rotation.x=rx};
  }

  function makeLandmark81(){
   const g=new THREE.Group();
   const glassMain=new THREE.MeshStandardMaterial({color:0x38bdf8,emissive:0x0284c7,emissiveIntensity:0.32,roughness:0.18,metalness:0.78});
   const glassAccent=new THREE.MeshStandardMaterial({color:0xe0f2fe,emissive:0x38bdf8,emissiveIntensity:0.25,roughness:0.22,metalness:0.82});
   const trimLight=new THREE.MeshStandardMaterial({color:0xfef08a,emissive:0xf59e0b,emissiveIntensity:0.9,roughness:0.3});
   const addPart=(w,h,d,mat,x,y,z,edge=true)=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
    m.position.set(x,y+h/2,z);
    m.castShadow=true;m.receiveShadow=true;
    if(edge)m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.28})));
    g.add(m);return m;
   };
   addPart(1.35,0.28,1.35,glassAccent,0,0,0);
   addPart(0.95,0.45,0.85,glassMain,-0.12,0.28,0.08);
   addPart(0.82,0.75,0.76,glassAccent,0.14,0.28,-0.12);
   const tiers=[
    [0.68,0.72,0.68,0,0.73,0],
    [0.58,0.72,0.58,0.03,1.45,0.02],
    [0.49,0.72,0.49,0.06,2.17,0.04],
    [0.40,0.68,0.40,0.09,2.89,0.05],
    [0.32,0.64,0.32,0.11,3.57,0.06],
    [0.24,0.56,0.24,0.13,4.21,0.07]
   ];
   let topY=4.77;
   tiers.forEach(([w,h,d,x,y,z],idx)=>{
    addPart(w,h,d,idx%2===0?glassMain:glassAccent,x,y,z);
    if(idx===2||idx===4){
     const band=new THREE.Mesh(new THREE.BoxGeometry(w+0.04,0.04,d+0.04),trimLight);
     band.position.set(x,y+h*0.85,z);g.add(band);
    }
    topY=y+h;
   });
   const crown=new THREE.Mesh(new THREE.ConeGeometry(0.16,0.62,4),glassAccent);
   crown.rotation.y=Math.PI/4;
   crown.position.set(0.13,topY+0.31,0.07);
   crown.castShadow=true;g.add(crown);
   const spire=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.04,0.85,10),trimLight);
   spire.position.set(0.13,topY+0.62+0.425,0.07);
   spire.castShadow=true;g.add(spire);
   return {group:g,spire,glassMain};
  }

  function makeBitexco(){
   const g=new THREE.Group();
   const towerMat=new THREE.MeshStandardMaterial({color:0xbae6fd,emissive:0x0284c7,emissiveIntensity:0.28,roughness:0.18,metalness:0.8});
   const ribMat=new THREE.LineBasicMaterial({color:0xf8fafc,transparent:true,opacity:0.35});
   const plinth=new THREE.Mesh(new THREE.CylinderGeometry(0.56,0.64,0.24,16),new THREE.MeshStandardMaterial({color:0x475569,roughness:0.55,metalness:0.4}));
   plinth.position.y=0.12;plinth.castShadow=true;plinth.receiveShadow=true;g.add(plinth);
   const bodyH=2.65;
   const bodyGeo=new THREE.CylinderGeometry(0.24,0.46,bodyH,18,6);
   const body=new THREE.Mesh(bodyGeo,towerMat);
   body.position.y=0.24+bodyH/2;body.castShadow=true;body.receiveShadow=true;
   body.add(new THREE.LineSegments(new THREE.EdgesGeometry(bodyGeo),ribMat));
   g.add(body);
   const padY=1.92;
   const arm=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.07,0.22),new THREE.MeshStandardMaterial({color:0x64748b,roughness:0.4,metalness:0.7}));
   arm.position.set(0.26,padY,0);arm.castShadow=true;g.add(arm);
   const padRing=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,0.07,20),new THREE.MeshStandardMaterial({color:0xfbbf24,emissive:0xd97706,emissiveIntensity:0.35,roughness:0.3,metalness:0.65}));
   padRing.position.set(0.52,padY,0);padRing.castShadow=true;g.add(padRing);
   const padDeck=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.25,0.08,20),new THREE.MeshStandardMaterial({color:0x1e293b,roughness:0.6,metalness:0.3}));
   padDeck.position.set(0.52,padY+0.005,0);g.add(padDeck);
   const cap=new THREE.Mesh(new THREE.ConeGeometry(0.24,0.38,18),towerMat);
   cap.position.set(0,0.24+bodyH+0.19,0);cap.castShadow=true;g.add(cap);
   return {group:g,padRing};
  }

  function makeSaigonBridge(){
   const g=new THREE.Group();
   const deckMat=M(0x475569,0x0f172a,.15,.45,.52);
   const steelMat=M(0x38bdf8,0x0284c7,.3,.65,.28);
   const lightMat=M(0xfef08a,0xf59e0b,.85,.1,.3);
   const bridgeLen=2.15, bridgeW=.62;
   bx(g,bridgeLen,.09,bridgeW,deckMat,0,.18,0,true,true,true);
   bx(g,bridgeLen-.1,.02,.04,lightMat,0,.27,0,false,false,false);
   [-bridgeW/2+.02,bridgeW/2-.02].forEach(z=>{
    bx(g,bridgeLen,.08,.03,steelMat,0,.27,z,false,false,false);
   });
   const towerMat=M(0x94a3b8,0x1e293b,.15,.6,.35);
   [-.55,.55].forEach(px=>{
    [-.16,.16].forEach(pz=>{
     bx(g,.07,.78,.07,towerMat,px,.24,pz,true,true,false);
     const beacon=new THREE.Mesh(new THREE.SphereGeometry(.035,8,8),lightMat);
     beacon.position.set(px,1.04,pz);
     g.add(beacon);
    });
    bx(g,.08,.07,.39,towerMat,px,.95,0,true,false,false);
    [-.32,-.16,.16,.32].forEach(dx=>{
     const cable=new THREE.Mesh(new THREE.CylinderGeometry(.008,.008,.56,6),steelMat);
     cable.position.set(px+dx,.56,.16);
     cable.rotation.z=dx>0?-0.42:0.42;
     g.add(cable);
    });
   });
   return g;
  }

  function makeCar(bodyColor,isBus=false){
   const c=new THREE.Group();
   const w=isBus?.22:.18, h=isBus?.18:.1, l=isBus?.48:.34;
   bx(c,w,h,l,M(bodyColor,bodyColor,.12,.35,.35),0,.03,0,true,true,false);
   bx(c,w*.82,isBus?.08:.07,l*.62,M(0xbae6fd,0x0284c7,.25,.2,.15),0,.03+h,isBus?0:-.02,false,false,false);
   const hl=M(0xfef08a,0xfde047,.9,.1,.3);
   [-w*.32,w*.32].forEach(wx=>bx(c,.035,.035,.02,hl,wx,.05,l/2+.005,false,false,false));
   return c;
  }

  function city(){
   const g=new THREE.Group(),rnd=rng(7);
   const base=new THREE.Mesh(new THREE.CylinderGeometry(6.4,6.65,.35,64),M(0x1e293b,0x0f172a,.2,.15,.82));
   base.position.y=-.175;base.receiveShadow=true;g.add(base);

   const riverX=3.75, riverW=1.45;
   bx(g,riverW+.28,.02,11.4,M(0x64748b,0x1e293b,.1,.2,.7),riverX,.005,0,false,false,true);
   const wr=makeWater(riverW,11.2,10,48,0x0284c7);
   wr.mesh.position.set(riverX,.045,0);
   g.add(wr.mesh);

   [0,.5].forEach((ph,bi)=>{
    const b=new THREE.Group();b.position.x=riverX+(bi?.28:-.28);g.add(b);
    bx(b,.26,.1,.62,M(0xf8fafc,0,0,.25,.35),0,.02,0,true);
    bx(b,.15,.09,.22,M(bi?0xf59e0b:0xe11d48,0x9f1239,.25,.2,.4),0,.12,-.06,true,false);
    const fl=floater(b,wr,()=>b.position.x-riverX,()=>b.position.z,.05,60,6);let wk=0;
    locAnim.push((t,dt)=>{b.position.z=4.8-((t*.28+ph)%1)*9.6;fl(t,dt);wk+=dt;if(wk>.7){wk=0;wr.ripple(b.position.x-riverX,b.position.z+.35,t)}});
   });

   const roadMat=M(0x0f172a,0x020617,.15,.15,.88);
   const lineMat=M(0xfacc15,0xeab308,.45,.1,.4);
   const roadZ=[-2.2,1.1];
   const roadX=[-2.5,.2];
   roadZ.forEach(rz=>{
    bx(g,5.8,.018,.56,roadMat,-.3,.005,rz,false,false,true);
    for(let s=-2.7;s<=2.2;s+=.65)bx(g,.28,.022,.035,lineMat,s,.008,rz,false,false,false);
   });
   roadX.forEach(rx=>{
    bx(g,.56,.018,8.8,roadMat,rx,.005,0,false,false,true);
    for(let s=-3.8;s<=3.8;s+=.65)bx(g,.035,.022,.28,lineMat,rx,.008,s,false,false,false);
   });

   const bridge=makeSaigonBridge();
   bridge.position.set(3.78,0,-1.1);
   g.add(bridge);

   const pal=[
    M(0x334155,0x0f172a,.15,.35,.55),
    M(0x475569,0x1e293b,.15,.25,.62),
    M(0x0369a1,0x0c4a6e,.2,.65,.24),
    M(0x64748b,0x1e293b,.15,.4,.48)
   ];
   const parkMat=M(0x15803d,0x052e16,.15,.05,.86);
   const winMat=M(0xfef08a,0xf59e0b,.85,.1,.3);

   const onRoad=(x,z)=>roadZ.some(rz=>Math.abs(z-rz)<.46)||roadX.some(rx=>Math.abs(x-rx)<.46)||(Math.abs(z+1.1)<.46&&x>2.65&&x<5.05);
   const onRiver=(x,z)=>x>riverX-riverW*.55-0.25&&Math.abs(z)<5.75;

   for(let i=-5;i<=5;i++)for(let j=-5;j<=5;j++){
    const x=i*1.02+(rnd()-.5)*.14,z=j*1.02+(rnd()-.5)*.14;
    if(Math.hypot(x,z)>5.65)continue;
    if(onRoad(x,z)||onRiver(x,z))continue;
    if(Math.hypot(x+1.35,z+.55)<1.05||Math.hypot(x-1.25,z+2.35)<.95)continue;
    const distC=Math.hypot(x,z);
    const isPark=distC>3.2&&rnd()<.18;
    const h=isPark?.08:.28+rnd()*Math.max(.35,1.25-distC*.11);
    bx(g,isPark?.68:.56,h,isPark?.68:.56,isPark?parkMat:pal[(rnd()*4)|0],x,0,z,!isPark);
    if(!isPark&&h>.75&&rnd()<.45){
     const wy=.2+rnd()*(h-.35);
     const w=bx(g,.58,.055,.12,winMat,x,wy,z,false,false,false);
     w.rotation.y=(rnd()-.5)*.35;
    }
   }

   const l81=makeLandmark81();
   l81.group.position.set(-1.35,0,-.55);
   g.add(l81.group);

   const btx=makeBitexco();
   btx.group.position.set(1.25,0,2.35);
   g.add(btx.group);

   const ttCols=[0x0284c7,0xf59e0b,0x38bdf8,0x64748b];
   [1.5,2.1,1.3,1.8].forEach((h,k)=>{
    const tx=4.85+(k%2)*.42, tz=-2.2+k*1.45;
    if(Math.hypot(tx,tz)<5.65&&Math.abs(tz+1.1)>.45)bx(g,.52,h,.52,M(ttCols[k],0x0f172a,.12,.55,.32),tx,0,tz,true);
   });

   const carColors=[0xf8fafc,0xfbbf24,0xef4444,0x38bdf8,0x22c55e];
   const traffic=[];
   roadZ.forEach((rz,ri)=>{
    for(let c=0;c<2;c++){
     const dir=c===0?1:-1;

 heroIn.style.transform=`translate3d(0,${(y*.22).toFixed(1)}px,0) scale(${(1-.05*k).toFixed(3)})`;
 heroIn.style.opacity=(1-k*.9).toFixed(2);
 heroCue.style.opacity=(1-Math.min(1,y/120)).toFixed(2);
}
function initHero(){
 const hero=$('#hero'),cv=$('#heroFx'),ctx=cv.getContext('2d');
 let W=0,H=0,dpr=1,pts=[],vis=true;
 const mk=()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.6+.6});
 function size(){
  const r=hero.getBoundingClientRect(); if(!r.width)return;
  W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;
  const n=Math.max(24,Math.min(80,Math.round(W*H/16000)));
  pts=Array.from({length:n},mk);
 }
 function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  for(const p of pts){
   if(!reduce){
    p.vx*=.995;p.vy*=.995;p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=W;else if(p.x>W)p.x=0;
    if(p.y<0)p.y=H;else if(p.y>H)p.y=0;
   }
  }
  ctx.lineWidth=1;
  for(let i=0;i<pts.length;i++){
   const a=pts[i];
   for(let j=i+1;j<pts.length;j++){
    const b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d<120){ctx.strokeStyle=`rgba(125,211,252,${((1-d/120)*.22).toFixed(3)})`;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
   }
   ctx.fillStyle='rgba(186,230,253,.75)';ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,6.2832);ctx.fill();
  }
 }
 function loop(){if(vis&&!document.hidden)draw();requestAnimationFrame(loop)}
 new IntersectionObserver(e=>vis=e[0].isIntersecting).observe(hero);
 new ResizeObserver(()=>{size();if(reduce)draw()}).observe(hero);
 setInterval(()=>{if(!document.hidden&&vis)rotTick()},2400);
 size();if(reduce)draw();else requestAnimationFrame(loop);
}

document.addEventListener('click',e=>{
 const el=e.target instanceof Element?e.target:e.target&&e.target.parentElement;
 if(!el||typeof el.closest!=='function')return;
 const k=el.closest('#bento [data-k], #acc [data-k]'); if(k)openDetail(k.dataset.k);
 const n=el.closest('[data-n]'); if(n){play('wrap');toast(t('pv')(esc(n.dataset.n)),t('pt'))}
 if(el.closest('[data-kiet]'))openKiet();
 const sb=el.closest('.sb'); if(sb){const p=document.createElement('span');p.className='pulse';sb.appendChild(p);setTimeout(()=>p.remove(),650)}
});
document.addEventListener('pointerenter',e=>{
 if(e.pointerType!=='mouse')return;
 const el=e.target instanceof Element?e.target:e.target&&e.target.parentElement;
 if(el&&typeof el.closest==='function'&&el.closest('button, a, .sb, .oc, .pxc, .acc-i'))play('hover');
},{capture:true,passive:true});
document.addEventListener('keydown',e=>{
 if((e.key==='Enter'||e.key===' ')&&e.target instanceof Element&&e.target.matches('.sb[role=button]')){e.preventDefault();e.target.click()}
});
document.addEventListener('pointermove',e=>{
 const el=e.target instanceof Element?e.target:e.target&&e.target.parentElement;
 const c=el&&typeof el.closest==='function'?el.closest('.card'):null; if(!c)return;
 const r=c.getBoundingClientRect(); c.style.setProperty('--mx',(e.clientX-r.left)+'px'); c.style.setProperty('--my',(e.clientY-r.top)+'px');
});

$('#t2').onclick=openTopic2;

$('#top').onclick=()=>scrollTo({top:0,behavior:'smooth'});

/* ---------- CUỘN: thanh tiến độ + hiệu ứng mờ chuyển động nhẹ ---------- */
const wrap=$('#wrap'), seSec=$('#se'); let lastY=scrollY, ticking=false, blurTimer=null;
addEventListener('scroll',()=>{
 if(ticking)return; ticking=true;
 requestAnimationFrame(()=>{
  const y=scrollY, dy=y-lastY; lastY=y;
  const h=document.documentElement.scrollHeight-innerHeight;
  $('#progress').style.width=(h>0?y/h*100:0)+'%';
  pxUpdate();heroScroll();$('#hdr').classList.toggle('sc',y>20);const top=$('#top'); top.classList.toggle('opacity-0',y<600); top.classList.toggle('pointer-events-none',y<600);
  const sr=seSec.getBoundingClientRect(), inSE=sr.top<innerHeight&&sr.bottom>0;
  if(document.body.classList.contains('is-rotating-3d')&&innerWidth<768){
   if(wrap.style.filter)wrap.style.filter='';
  }else if(!reduce&&!inSE&&Math.abs(dy)>25){
   wrap.style.filter=`blur(${Math.min(Math.abs(dy)*.03,2.5).toFixed(2)}px)`;
   clearTimeout(blurTimer); blurTimer=setTimeout(()=>wrap.style.filter='',120);
  }else if(inSE&&wrap.style.filter){wrap.style.filter=''}
  ticking=false;
 });
},{passive:true});

/* ---------- KHỞI TẠO ---------- */
renderAll(); syncSnd(); initVnBg(); initHalftone(); initFDI3D(); initScrollExpand(); initHero(); requestAnimationFrame(orbitLoop);
addEventListener('load',()=>{
 AOS.init({duration:800,once:true,disable:()=>reduce});
 const pre=$('#preloader'); let done=false;
 const hide=()=>{
  if(done)return; done=true;
  if(actx&&actx.state==='running')play('intro'); else play('tine');
  pre.style.opacity=0; pre.style.pointerEvents='none';
  setTimeout(()=>pre.remove(),700);
 };
 ['pointerdown','keydown'].forEach(evt=>{
  window.addEventListener(evt,()=>{
   const c=ensureAudio();
   if(c&&c.state==='running')play('intro');
  },{once:true,passive:true});
 });
 pre.addEventListener('click',hide); setTimeout(hide,1200);
});
